[project]
name = "genlogs-weather-pipeline"
version = "0.1.0"
description = "Hourly weather ingestion pipeline with Snowflake + dbt incremental modeling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.11.6",
    "dbt-snowflake>=1.11.3",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "snowflake-connector-python>=4.3.0",
]
