version: 2

models:
  - name: weather_hourly
    columns:
      - name: location_name
        tests:
          - not_null

      - name: forecast_hour
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
            arguments:
                combination_of_columns:
                    - location_name
                    - forecast_hour