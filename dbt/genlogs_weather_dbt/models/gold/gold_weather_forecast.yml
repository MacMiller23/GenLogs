version: 2

models:
  - name: gold_weather_forecast
    description: "Incremental analytics model containing hourly weather forecasts.
                  Built from the deduplicated silver layer and keyed by location_name
                  and forecast_hour to prevent duplicate forecast records"
    
    columns:
      - name: location_name
        description: "Name of the location for the weather forecast."
        tests:
          - not_null

      - name: forecast_hour
        description: "UTC formatted hour for which the weather is forecasted."
        tests:
          - not_null
      
      - name: temperature_2m_c
        description: "Forecasted temperature taken 2 meters off the ground in Celsius for the given location and hour."

      - name: temperature_2m_f
        description: "Forecasted temperature taken 2 meters off the ground in Fahrenheit for the given location and hour."

    tests:
      - dbt_utils.unique_combination_of_columns:
            arguments:
                combination_of_columns:
                    - location_name
                    - forecast_hour