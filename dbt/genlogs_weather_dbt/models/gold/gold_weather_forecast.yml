version: 2

models:
  - name: gold_weather_forecast
    description: "Gold layer of the weather forecast data"
    
    columns:
      - name: location_name
        description: "Name of the location for the weather forecast."
        tests:
          - not_null

      - name: forecast_hour
        description: "Hour for which the weather is forecasted."
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
            arguments:
                combination_of_columns:
                    - location_name
                    - forecast_hour